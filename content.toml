[[paper]]
section = "wp"
title = "Learning by Viewing? Social Learning, Regulatory Disclosure, and Firm Productivity in Shale Gas"
year = 2024
authors = ["T. Robert Fetter", "Christopher Timmins", "Douglas H. Wrenn"]
status = "R&R at American Economic Journal: Economic Policy"
notes = ["NBER Working Paper 25401"]
links = [
  { label = "Draft", url = "uploads/lbv_may20.pdf" },
  { label = "NBER", url = "https://www.nber.org/papers/w25401" },
]
topics = ["Energy", "Innovation"]
# Abstract source: abstract of the May 2020 draft.
abstract = """
In many industries firms can learn about new technologies from other adopters; mandatory disclosure regulations represent an understudied channel for this type of social learning.
We study an environmentally-focused law in the shale gas industry to examine firm claims that disclosure requirements expose valuable trade secrets.
Our research design takes advantage of a unique regulatory history that allows us to observe complete information on chemical inputs prior to disclosure, along with the timing of information availability for thousands of wells after disclosure takes effect.
We find that firms’ chemical choices following disclosure converge in a manner consistent with inter-firm imitation and that this leads to more productive wells for firms that carefully choose whom to copy — but also a decline in innovation among the most productive firms, whose innovations are those most often copied by other firms.
Our results suggest there is a long-run welfare trade-off between the potential benefits of information diffusion and transparency, and the potential costs of reduced innovation.
"""

