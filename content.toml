[[paper]]
section = "wp"
title = "Industry Dynamics with Social Learning: Evidence from Hydraulic Fracturing"
year = 2024
authors = []
notes = ["Finalist, Young Economists’ Essay Award, EARIE, 2022"]
links = [
  { label = "Draft", url = "uploads/idsl_draft.pdf" },
]
topics = ["Energy", "Innovation", "Market Entry"]
# Abstract source: the draft dated August 2024 (uploads/idsl_draft.pdf); same text as the January 2022 draft.
abstract = """
I model the interaction between dynamic decision making and social learning about new technologies in driving industry takeoff and productivity growth.
Learning about the use of new technologies is an important factor in economic growth, but I demonstrate that anticipated social learning can lead to a freeriding dynamic in scenarios with high enough uncertainty.
I consider the empirical setting of hydraulic fracturing in North Dakota, where firms learn about the optimal use of fracturing technology, in part due to detailed data published by regulators.
The cumulative value of this learning process is a ceteris paribus 40% increase in ex-ante expected profitability.
I model the impact of learning externalities on agents’ decisions to drill shale oil wells, an optimal stopping problem.
My estimates suggest that the social learning externality is too small to affect investment in later stages of industry development, after uncertainty is reduced.
Conversely, I demonstrate that under conditions of higher uncertainty, anticipated social learning can lead to significantly lower industry investment and slower rates of industry learning.
Under this scenario, I also demonstrate the potential for public tests of the technology to enhance welfare by leading to more investment and a higher learning rate.
"""

